<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C1411" />
    <title>RELIFE Fitness 排課系統</title>
    <style>
      /* ===== Reset & Base ===== */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --walnut: #1C1411;
        --oatmeal: #F5F0E8;
        --sage: #8B9D83;
        --sage-light: #B5C4A8;
        --sage-dark: #6B7D63;
        --text: #2C2520;
        --text-light: #6B6258;
        --border: #D9D0C5;
        --white: #FFFFFF;
        --accent: #C97B4A;
        --accent-light: #E8A87C;
        --danger: #C75450;
        --danger-light: #F5DCDC;

        /* 教練顏色 A-J */
        --c-A: #E57373; --c-B: #BA68C8; --c-C: #64B5F6; --c-D: #4DB6AC;
        --c-E: #81C784; --c-F: #FFD54F; --c-G: #FFB74D; --c-H: #A1887F;
        --c-I: #90A4AE; --c-J: #F06292;
      }
      body {
        font-family: -apple-system, "Microsoft JhengHei", "PingFang TC", sans-serif;
        background: var(--oatmeal);
        color: var(--text);
        min-height: 100vh;
        padding-top: 60px;
      }

      /* ===== Header ===== */
      header {
        position: fixed; top: 0; left: 0; right: 0; height: 60px;
        background: var(--walnut);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 1.5rem; z-index: 100;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      }
      header .logo {
        font-size: 0.85rem; letter-spacing: 0.25em; color: var(--oatmeal);
        font-weight: 600; text-transform: uppercase;
      }
      header .nav { display: flex; gap: 0.5rem; }
      header .nav button {
        background: none; border: 1px solid rgba(245,240,232,0.2);
        color: var(--oatmeal); font-size: 0.8rem; padding: 0.4rem 1rem;
        border-radius: 6px; cursor: pointer; transition: all 0.2s;
        font-family: inherit;
      }
      header .nav button:hover { background: rgba(245,240,232,0.1); }
      header .nav button.active {
        background: var(--sage); color: var(--walnut); border-color: var(--sage);
        font-weight: 600;
      }

      /* ===== Main Container ===== */
      #app { max-width: 1400px; margin: 0 auto; padding: 1rem; }

      /* ===== Date Navigation ===== */
      .date-nav {
        display: flex; align-items: center; justify-content: center;
        gap: 1rem; margin-bottom: 1.2rem; flex-wrap: wrap;
      }
      .date-nav button {
        background: var(--white); border: 1px solid var(--border);
        color: var(--text); font-size: 0.9rem; padding: 0.5rem 1.2rem;
        border-radius: 8px; cursor: pointer; transition: all 0.2s;
        font-family: inherit;
      }
      .date-nav button:hover { background: var(--sage-light); color: var(--walnut); }
      .date-nav .current-date {
        font-size: 1.15rem; font-weight: 600; color: var(--text);
        min-width: 200px; text-align: center;
      }
      .date-nav .today-btn {
        background: var(--sage); color: var(--white); border-color: var(--sage);
        font-size: 0.8rem; padding: 0.4rem 0.9rem;
      }
      .date-nav .today-btn:hover { background: var(--sage-dark); }

      /* ===== Day View ===== */
      #day-view { }
      .table-scroll {
        max-height: calc(100vh - 140px);
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--white);
      }
      .day-table {
        table-layout: fixed;
        border-collapse: separate; border-spacing: 0;
        width: 100%; min-width: 900px;
        font-size: 0.75rem;
      }
      .day-table th, .day-table td {
        border-bottom: 1px solid var(--border);
        border-right: 1px solid var(--border);
        text-align: center;
      }
      .day-table th.time-col { width: 65px; min-width: 65px; position: sticky; left: 0; z-index: 11; }
            .day-table th.space-col { width: 90px; min-width: 90px; }
      .day-table thead th {
        background: var(--walnut); color: var(--oatmeal);
        padding: 0.5rem 0.3rem; font-weight: 500; font-size: 0.72rem;
        position: sticky; top: 0; z-index: 10;
      }
      .day-table td.time-col {
        background: var(--white); font-weight: 500; color: var(--text-light);
        font-size: 0.68rem; position: sticky; left: 0; z-index: 5;
        min-width: 65px;
      }
      .day-table tr.hour-row td.time-col { font-weight: 600; color: var(--text); }
            .day-table tbody tr { height: 28px; }
            .day-table td.slot {
        padding: 0; height: 28px; cursor: pointer; position: relative;
      }
      .day-table td.slot.empty { background: #FAFAF7; }
      .day-table td.slot.empty:hover { background: var(--sage-light); }
      .day-table td.slot.booked {
        color: var(--white); font-weight: 600; font-size: 0.7rem;
      }
      .day-table td.slot.booked:hover { filter: brightness(1.1); }
      .day-table td.slot.continuation {
        opacity: 0.5; cursor: default;
      }
      /* 目前時間指示線 */
      .day-table td.current-time {
        box-shadow: inset 0 -2px 0 var(--accent);
      }

      /* ===== Month View ===== */
      #month-view { display: none; }
      .month-grid {
        display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
      }
      .month-weekday {
        text-align: center; font-size: 0.75rem; font-weight: 600;
        color: var(--text-light); padding: 0.3rem 0;
      }
      .month-day {
        background: var(--white); border: 1px solid var(--border);
        border-radius: 6px; padding: 0.4rem; min-height: 90px;
        cursor: pointer; transition: all 0.2s; position: relative;
      }
      .month-day:hover { border-color: var(--sage); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
      .month-day.other-month { opacity: 0.35; background: #EDE9E3; }
      .month-day.today { border-color: var(--accent); border-width: 2px; }
            .month-day.warning { background: #FFF3CD; border-color: #FFC107; }
            .month-day.danger  { background: #F8D7DA; border-color: #DC3545; }
            .month-day.selected { box-shadow: 0 0 0 3px var(--sage); }
      .month-day .day-num {
        font-size: 0.95rem; font-weight: 600; margin-bottom: 0.2rem;
      }
      .month-day .booking-summary {
        font-size: 0.62rem; line-height: 1.3; color: var(--text-light);
      }
      .month-day .full-tag {
        display: inline-block; font-size: 0.6rem; font-weight: 600;
        color: var(--danger); margin-top: 2px;
      }
      .month-day .free-tag {
        display: inline-block; font-size: 0.6rem; font-weight: 600;
        color: var(--sage-dark); margin-top: 2px;
      }

      /* ===== Modal ===== */
      .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(28,20,17,0.55); z-index: 200;
        display: none; align-items: center; justify-content: center;
      }
      .modal-overlay.active { display: flex; }
      .modal {
              position: relative;
              background: var(--white); border-radius: 12px; padding: 1.8rem;
              width: 90%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            }
            .modal-close {
              position: absolute; top: 10px; right: 12px;
              background: none; border: none; font-size: 1.2rem;
              color: var(--text-light); cursor: pointer; padding: 4px 8px;
              border-radius: 4px; line-height: 1;
            }
            .modal-close:hover { background: #EEE; color: var(--text); }
      .modal h2 {
        font-size: 1.1rem; margin-bottom: 0.3rem; color: var(--text);
      }
      .modal .modal-sub {
        font-size: 0.8rem; color: var(--text-light); margin-bottom: 1.2rem;
      }
      .modal label {
        display: block; font-size: 0.82rem; font-weight: 500;
        margin-bottom: 0.4rem; margin-top: 0.8rem; color: var(--text);
      }
      .modal select, .modal button.action-btn {
        width: 100%; padding: 0.55rem; font-size: 0.9rem;
        border: 1px solid var(--border); border-radius: 8px;
        font-family: inherit; background: var(--white); color: var(--text);
      }
      .modal select:focus { outline: none; border-color: var(--sage); }
      .coach-grid {
        display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
        margin-bottom: 0.5rem;
      }
      .coach-btn {
        padding: 0.5rem 0; border: 2px solid var(--border); border-radius: 8px;
        font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s;
        background: var(--white); color: var(--text); font-family: inherit;
      }
      .coach-btn:hover { border-color: var(--sage); }
      .coach-btn.selected {
              color: #1C1411; border-color: transparent; transform: scale(1.05);
            }
      /* 教練顏色（在 coach-btn 之後定義才能正確覆蓋） */
      .bg-A { background: var(--c-A); }.bg-B { background: var(--c-B); }
      .bg-C { background: var(--c-C); }.bg-D { background: var(--c-D); }
      .bg-E { background: var(--c-E); }.bg-F { background: var(--c-F); }
      .bg-G { background: var(--c-G); }.bg-H { background: var(--c-H); }
      .bg-I { background: var(--c-I); }.bg-J { background: var(--c-J); }
      .duration-row { display: flex; gap: 8px; margin-bottom: 0.5rem; }
      .duration-btn {
        flex: 1; padding: 0.5rem; border: 2px solid var(--border);
        border-radius: 8px; font-size: 0.88rem; font-weight: 600;
        cursor: pointer; background: var(--white); color: var(--text);
        font-family: inherit; transition: all 0.15s;
      }
      .duration-btn:hover { border-color: var(--sage); }
      .duration-btn.selected {
        background: var(--walnut); color: var(--oatmeal); border-color: var(--walnut);
      }
      .modal-actions {
        display: flex; gap: 8px; margin-top: 1.2rem;
      }
      .modal-actions button {
        flex: 1; padding: 0.6rem; border-radius: 8px; font-size: 0.88rem;
        font-weight: 600; cursor: pointer; border: none; font-family: inherit;
      }
      .btn-confirm { background: var(--sage); color: var(--white); }
      .btn-confirm:hover { background: var(--sage-dark); }
      .btn-cancel { background: #EEE; color: var(--text); }
      .btn-cancel:hover { background: #DDD; }
      .btn-delete { background: var(--danger-light); color: var(--danger); }
      .btn-delete:hover { background: var(--danger); color: var(--white); }

      /* ===== Loading & Toast ===== */
      .loading {
        position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
        background: var(--oatmeal); display: flex; align-items: center;
        justify-content: center; z-index: 150;
      }
      .loading .spinner {
        width: 40px; height: 40px; border: 4px solid var(--border);
        border-top-color: var(--sage); border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .toast {
        position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
        background: var(--walnut); color: var(--oatmeal); padding: 0.7rem 1.5rem;
        border-radius: 8px; font-size: 0.85rem; z-index: 300;
        opacity: 0; transition: opacity 0.3s, transform 0.3s;
        pointer-events: none;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }

      /* ===== Responsive ===== */
      @media (max-width: 768px) {
        header .logo { font-size: 0.7rem; letter-spacing: 0.15em; }
        header .nav button { font-size: 0.7rem; padding: 0.3rem 0.6rem; }
        .date-nav .current-date { font-size: 1rem; min-width: 140px; }
        .month-day { min-height: 60px; padding: 0.25rem; }
        .month-day .day-num { font-size: 0.75rem; }
        .month-day .booking-summary { font-size: 0.55rem; }
        .day-table { font-size: 0.65rem; }
        .day-table th, .day-table td { padding: 0.2rem 0.1rem; }
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="logo">RELIFE Fitness · 排課系統</div>
      <nav class="nav">
        <button id="tab-day" class="active" onclick="switchView('day')">日檢視</button>

        <div id="modal-create" style="display:none">

          <div class="coach-grid" id="coach-grid"></div>
                    <div id="nickname-row" style="display:none">
                      <label for="nickname-input">請輸入暱稱</label>
                      <input type="text" id="nickname-input" placeholder="例如：小明" style="width:100%;padding:0.5rem;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;font-family:inherit;margin-bottom:0.5rem">
                    </div>
                    <label>課程時長</label>
          <div class="duration-row">
                                <button class="duration-btn selected" data-dur="75" onclick="selectDuration(75)">75 分鐘</button>

                                                            </select>
                                        <label for="remark-input">📝 備註</label>
                                        <input type="text" id="remark-input" placeholder="選填，例如：體驗課、調整姿勢" style="width:100%;padding:0.5rem;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;font-family:inherit;margin-bottom:0.5rem">

                    <input type="password" id="pwd-create" placeholder="請輸入密碼" style="width:100%;padding:0.5rem;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;font-family:inherit;margin-bottom:0.5rem">

                                                                                </select>

    <script type="module">
// ====== FIREBASE CONFIG ======
      const firebaseConfig = {
        apiKey: "AIzaSyBLPb2IPs27u0V_BCL8ASS7QSUqcQnFR2g",
        authDomain: "relifefitness.firebaseapp.com",
        databaseURL: "https://relifefitness-default-rtdb.firebaseio.com",
        projectId: "relifefitness",
        storageBucket: "relifefitness.firebasestorage.app",
        messagingSenderId: "608012988598",
        appId: "1:608012988598:web:eaf9c284851f95f0d27617",
        measurementId: "G-G1WBW50XF1"
      };

      window.USE_FALLBACK = false;

      if (!window.USE_FALLBACK) {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
        const { getDatabase, ref, onValue, set, push, remove, update }
          = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js");

        const app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
        window._ref = ref;
        window._onValue = onValue;
        window._set = set;
        window._push = push;
        window._remove = remove;
        window._update = update;
      }

      // ====== CONSTANTS ======
                  const SPACES = 9;
                  const SPACE_NAMES = ['行政時段','一樓槓座','一樓史密斯','一樓cable','一樓機動空間','二樓槓座','二樓自由重量(1)','二樓自由重量(2)','二樓機動空間'];
                  function spaceName(n) { return SPACE_NAMES[n-1] || `空間 ${n}`; }
                  function isAdminSpace(n) { return n === 1; }

      // 🏷️ 教練名單 — 修改這裡即可更改顯示名稱！
            //    格式：'代號': '顯示名稱'
            const COACH_NAMES = {
                          'A': '史昕銓',
                          'B': '其他',
                          'C': '團課',
                        };
                        const COACHES = Object.keys(COACH_NAMES);
                        // 🔄 可以重疊預約的教練代號（例如「其他」可以跟任何人重疊）
                        const CAN_OVERLAP = new Set(['B']);
                        // 🏋️ 團課空間（不可個別預約，選團課時一次佔三格）
                        const TEAM_SPACES = [7, 8, 9];
            function coachName(code) { return COACH_NAMES[code] || code; }
            function canOverlap(code) { return CAN_OVERLAP.has(code); }

      // 檢查同一教練是否已在其他空間有重疊預約
      function hasCoachConflict(dateStr, coachCode, startSlot, durationSlots, excludeId) {
        if (canOverlap(coachCode)) return false; // 「其他」不受限
        const list = getBookingsForDate(dateStr);
        const endSlot = startSlot + durationSlots;
        for (const b of list) {
          if (excludeId && b.id === excludeId) continue;
          if (b.coach !== coachCode) continue;
          const bStart = timeToSlot(b.time);
          const bEnd = bStart + durationToSlots(b.duration);
          if (startSlot < bEnd && endSlot > bStart) return true;
        }
        return false;
      }
      const OPEN_HOUR = 9;          // 09:00
      const CLOSE_HOUR = 22;         // 22:00
      const SLOT_MINUTES = 15;
      const SLOTS_PER_DAY = (CLOSE_HOUR - OPEN_HOUR) * 60 / SLOT_MINUTES; // 52

            const PASSWORD = '2026';
            function checkPassword(fieldId) {
              const input = document.getElementById(fieldId);
              if (input.value !== PASSWORD) {
                showToast('❌ 密碼錯誤，無法進行編輯！');
                input.value = '';
                return false;
              }
              input.value = '';
              return true;
            }

            // Firebase 寫入包裝（含錯誤處理）
            async function fbSet(ref, data) {
              try { await window._set(ref, data); return true; }
              catch(e) { console.error(e); showToast('⚠️ 寫入失敗，請檢查網路'); return false; }
            }
            async function fbUpdate(ref, data) {
              try { await window._update(ref, data); return true; }
              catch(e) { console.error(e); showToast('⚠️ 更新失敗，請檢查網路'); return false; }
            }
            async function fbRemove(ref) {
              try { await window._remove(ref); return true; }
              catch(e) { console.error(e); showToast('⚠️ 刪除失敗，請檢查網路'); return false; }
            }
      let currentDate = new Date();
      let currentView = 'day';
      let bookings = {};        // key: "YYYY-MM-DD" -> [ {id, space, coach, time, duration} ]
      let selectedCoach = null;
      let selectedDuration = 75;
      let editingCoach = null;
      let editingDuration = 75;
      let editingBookingId = null;
      let editingSlot = null;

      // ====== DATE UTILS ======
      function fmtDate(d) {
        const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
        return `${y}-${m}-${day}`;
      }
      function slotToTime(slotIndex) {
        const totalMin = OPEN_HOUR*60 + slotIndex*SLOT_MINUTES;
        const h = Math.floor(totalMin/60), m = totalMin%60;
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      }
      function timeToSlot(timeStr) {
        const [h,m] = timeStr.split(':').map(Number);
        return (h*60 + m - OPEN_HOUR*60) / SLOT_MINUTES;
      }
      function slotsToDuration(slots) { return slots * SLOT_MINUTES; }
      function durationToSlots(min) { return min / SLOT_MINUTES; }
      function getWeekdayName(d) {
        return ['日','一','二','三','四','五','六'][d.getDay()];
      }
      function isToday(d) {
        const t = new Date();
        return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
      }

      // ====== FALLBACK STORAGE (LocalStorage) ======
            let bookmarks = {}; // fallback storage

            function loadFallbackBookings() {
              const raw = localStorage.getItem('relife_bookings');
              bookmarks = raw ? JSON.parse(raw) : {};
            }
            function saveFallbackBookings() {
              localStorage.setItem('relife_bookings', JSON.stringify(bookmarks));
            }

      // ====== DATA ACCESS ======
      function getBookingsForDate(dateStr) {
        const data = bookings[dateStr];
        if (!data) return [];
        // Firebase push 結構是物件 {key: booking}，需轉成陣列
        if (Array.isArray(data)) return data;
        return Object.values(data);
      }

      function findBookingAtSlot(dateStr, space, slot) {
        const list = getBookingsForDate(dateStr);
        for (const b of list) {
          const startSlot = timeToSlot(b.time);
          const endSlot = startSlot + durationToSlots(b.duration);
          if (b.space == space && slot >= startSlot && slot < endSlot) return b;
        }
        return null;
      }

      function hasConflict(dateStr, space, startSlot, durationSlots, excludeId, coachCode) {
              // 「其他」教練可以重疊，不檢查衝突
              if (coachCode && canOverlap(coachCode)) return false;
              const list = getBookingsForDate(dateStr);
              const endSlot = startSlot + durationSlots;
              for (const b of list) {
                if (excludeId && b.id === excludeId) continue;
                if (b.space != space) continue;
                // 若對方是「其他」，也不擋（雙向都放行）
                if (canOverlap(b.coach)) continue;
                const bStart = timeToSlot(b.time);
                const bEnd = bStart + durationToSlots(b.duration);
                if (startSlot < bEnd && endSlot > bStart) return true;
              }
              return false;
            }

      function isSlotWithinBounds(startSlot, durationSlots) {
        return startSlot + durationSlots <= SLOTS_PER_DAY;
      }

      function isTimeSlotFull(dateStr, slot) {
        // 8 spaces all occupied at this slot
        let count = 0;
        for (let s=1; s<=SPACES; s++) {
          if (findBookingAtSlot(dateStr, s, slot)) count++;
        }
        return count >= SPACES;
      }

      function getFullTimeRanges(dateStr) {
        // 找出連續已滿的時段範圍
        const ranges = [];
        let rangeStart = null;
        for (let i=0; i<SLOTS_PER_DAY; i++) {
          if (isTimeSlotFull(dateStr, i)) {
            if (rangeStart === null) rangeStart = i;
          } else {
            if (rangeStart !== null) {
              ranges.push({ start: rangeStart, end: i });
              rangeStart = null;
            }
          }
        }
        if (rangeStart !== null) ranges.push({ start: rangeStart, end: SLOTS_PER_DAY });
        return ranges;
      }

      function getBusyTimeRanges(dateStr) {
        // 找出有預約的時段（至少有一間）— for month view summary
        const ranges = [];
        let rangeStart = null;
        for (let i=0; i<SLOTS_PER_DAY; i++) {
          if (isTimeSlotFull(dateStr, i)) {
            if (rangeStart === null) rangeStart = i;
          } else {
            if (rangeStart !== null) {
              ranges.push({ start: rangeStart, end: i, full: true });
              rangeStart = null;
            }
          }
        }
        if (rangeStart !== null) ranges.push({ start: rangeStart, end: SLOTS_PER_DAY, full: true });
        return ranges;
      }

      // ====== RENDER: DAY VIEW ======
      function renderDayView() {
        const dateStr = fmtDate(currentDate);
        const table = document.getElementById('day-table');
        table.innerHTML = '';

        // Header row
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        headRow.innerHTML = '<th class="time-col">時間</th>' +
          Array.from({length:SPACES}, (_,i)=>`<th class="space-col">${spaceName(i+1)}</th>`).join('');
        thead.appendChild(headRow);
        table.appendChild(thead);

        // Body
        const tbody = document.createElement('tbody');
        for (let i=0; i<SLOTS_PER_DAY; i++) {
          const tr = document.createElement('tr');
          if (i % 4 === 0) tr.classList.add('hour-row');

          // Time column
          const tdTime = document.createElement('td');
          tdTime.className = 'time-col';
          tdTime.textContent = slotToTime(i);
          tr.appendChild(tdTime);

          // Space columns
          for (let s=1; s<=SPACES; s++) {
            const td = document.createElement('td');
            td.className = 'slot empty';

            const b = findBookingAtSlot(dateStr, s, i);
            if (b) {
              const bStartSlot = timeToSlot(b.time);
              if (i === bStartSlot) {
                // 第一格顯示教練代號
                td.className = `slot booked bg-${b.coach}`;
                                td.innerHTML = (b.nickname || coachName(b.coach)) + (b.remark ? `<br><small style="font-size:0.6rem;opacity:0.85">${b.remark}</small>` : '');
                td.onclick = () => openEditModal(b, dateStr);
                td.rowSpan = durationToSlots(b.duration);
              } else {
                // 被合併的後續格，跳過（rowSpan 處理）
                continue;
              }
            } else {
              td.onclick = () => openCreateModal(s, i, dateStr);
            }

            // 目前時間指示
            if (isToday(currentDate)) {
              const now = new Date();
              const nowMin = now.getHours()*60 + now.getMinutes() - OPEN_HOUR*60;
              const nowSlot = Math.floor(nowMin / SLOT_MINUTES);
              if (i === nowSlot) td.classList.add('current-time');
            }

            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
      }

      // ====== RENDER: MONTH VIEW ======
      function renderMonthView() {
        const weekdays = document.getElementById('month-weekdays');
        weekdays.innerHTML = ['日','一','二','三','四','五','六']
          .map(d => `<div class="month-weekday">${d}</div>`).join('');

        const grid = document.getElementById('month-grid');
        grid.innerHTML = '';

        const year = currentDate.getFullYear(), month = currentDate.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month+1, 0);
        const startWeekday = firstDay.getDay();

        // 上月剩餘天數
        for (let i = startWeekday-1; i >= 0; i--) {
          const d = new Date(year, month, -i);
          grid.appendChild(makeMonthDay(d, true));
        }
        // 本月
        for (let i = 1; i <= lastDay.getDate(); i++) {
          grid.appendChild(makeMonthDay(new Date(year, month, i), false));
        }
        // 下月補滿
        const totalCells = startWeekday + lastDay.getDate();
        const remaining = (7 - (totalCells % 7)) % 7;
        for (let i = 1; i <= remaining; i++) {
          grid.appendChild(makeMonthDay(new Date(year, month+1, i), true));
                  }
                  renderCoachSummary(year, month);
                }

                function renderCoachSummary(year, month) {
                  const summary = document.getElementById('coach-summary');
                  const counts = {};
                  // 遍歷本月每一天
                  const lastDay = new Date(year, month+1, 0);
                  for (let d = 1; d <= lastDay.getDate(); d++) {
                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const bookings = getBookingsForDate(dateStr);
                    for (const b of bookings) {
                      // 排除「其他」和「團課」
                      if (b.coach === 'B' || b.coach === 'C') continue;
                      const name = coachName(b.coach);
                      counts[name] = (counts[name] || 0) + 1;
                    }
                  }
                  const entries = Object.entries(counts);
                  if (entries.length === 0) {
                    summary.innerHTML = '<span style="color:var(--text-light)">本月尚無教練預約</span>';
                  } else {
                    summary.innerHTML = '<strong>📊 本月教練堂數</strong><br>' +
                      entries.map(([name, count]) => `${name}: ${count} 堂`).join('&nbsp;&nbsp;|&nbsp;&nbsp;');
                  }
                }

      function makeMonthDay(d, otherMonth) {
              const dateStr = fmtDate(d);
              const div = document.createElement('div');
              div.className = 'month-day' + (otherMonth ? ' other-month' : '') + (isToday(d) ? ' today' : '');

              if (!otherMonth) {
                // 統計每 15 分鐘槽有多少空間被佔用
                let maxOccupied = 0;
                let busySlots = 0;
                for (let slot = 0; slot < SLOTS_PER_DAY; slot++) {
                  let count = 0;
                  for (let s = 1; s <= SPACES; s++) {
                    if (findBookingAtSlot(dateStr, s, slot)) count++;
                  }
                  if (count > maxOccupied) maxOccupied = count;
                  if (count >= 6) busySlots++;
                }
                if (busySlots > 12) div.classList.add('danger');
                else if (maxOccupied >= 6) div.classList.add('warning');
              }

              div.innerHTML = `<div class="day-num">${d.getDate()}</div>`;

                      let clickCount = 0;
                      div.onclick = () => {
                        clickCount++;
                        if (clickCount === 1) {
                          // 第一次：選中高亮
                          document.querySelectorAll('.month-day.selected').forEach(el => el.classList.remove('selected'));
                          div.classList.add('selected');
                        } else {
                          // 第二次：跳轉日檢視
                          currentDate = new Date(d);
                          switchView('day');
                        }
                      };
        return div;
      }

      function renderCoachGrid(containerId, isEdit, spaceNum) {

      async function createBooking() {
                    if (!checkPassword('pwd-create')) return;
                    if (!selectedCoach) { showToast('請選擇教練代號！'); return; }
              const { space, slot, dateStr } = editingSlot;
              const durSlots = durationToSlots(selectedDuration);

              if (!isSlotWithinBounds(slot, durSlots)) {
                showToast('預約時段超過營業時間（22:00）！');
                return;
              }

              // 團課：需一次檢查三個空間
              const spacesToBook = selectedCoach === 'C' ? TEAM_SPACES : [space];
              if (selectedCoach === 'C' && !TEAM_SPACES.includes(space)) {
                showToast('團課僅限二樓自由重量區！'); return;
              }

              // 檢查所有目標空間的衝突
              for (const sp of spacesToBook) {
                if (hasConflict(dateStr, sp, slot, durSlots, null, selectedCoach)) {
                  showToast(`${spaceName(sp)} 此時段已有預約衝突！`); return;
                }
              }
              if (hasCoachConflict(dateStr, selectedCoach, slot, durSlots)) {
                showToast('⚠️ 該教練此時段已有其他預約！');
                return;
              }

              const groupId = (selectedCoach === 'C') ? 'team_' + Date.now() : null;
              const remark = document.getElementById('remark-input').value.trim();

              for (const sp of spacesToBook) {
                const booking = {
                  space: sp, coach: selectedCoach, time: slotToTime(slot),
                  duration: selectedDuration, createdAt: Date.now()
                };
                if (groupId) booking.groupId = groupId;
                if (canOverlap(selectedCoach)) {
                  const nick = document.getElementById('nickname-input').value.trim();
                  if (!nick) { showToast('請輸入暱稱！'); return; }
                  booking.nickname = nick;
                }
                if (remark) booking.remark = remark;

                if (window.USE_FALLBACK) {
                  if (!bookmarks[dateStr]) bookmarks[dateStr] = [];
                  booking.id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
                  bookmarks[dateStr].push(booking);
                  saveFallbackBookings();
                } else {
                  const dbRef = window._ref(window.db, `bookings/${dateStr}`);
                  const newRef = window._push(dbRef);
                  booking.id = newRef.key;
                  if (!await fbSet(newRef, booking)) return;
                }
              }

              closeModal();
                            const label = selectedCoach === 'C' ? '團課' : coachName(selectedCoach);
                            showToast(`✅ 預約成功：${spaceName(space)} ${slotToTime(slot)} ${label}`);
                            if (window.USE_FALLBACK) { bookings = bookmarks; }
                            switchView(currentView);
            }

      async function updateBooking() {
              if (!checkPassword('pwd-edit')) return;
              if (!editingCoach) { showToast('請選擇教練代號！'); return; }
        const { space, slot, dateStr } = editingSlot;
        const durSlots = durationToSlots(editingDuration);

        if (!isSlotWithinBounds(slot, durSlots)) {
          showToast('預約時段超過營業時間（22:00）！');
          return;
        }
        if (hasConflict(dateStr, space, slot, durSlots, editingBookingId, editingCoach)) {
                  showToast('此時段已有其他預約衝突！');
                  return;
                }
                if (hasCoachConflict(dateStr, editingCoach, slot, durSlots, editingBookingId)) {
                  showToast('⚠️ 該教練此時段已有其他預約！');
                  return;
                }

        const updated = {
                  space, coach: editingCoach, time: slotToTime(slot),
                  duration: editingDuration, updatedAt: Date.now()
                };
                // 處理備註（空字串則不更新，保留原值）
                                const origRemark = document.getElementById('remark-edit').value.trim();
                                if (origRemark) updated.remark = origRemark;

        if (window.USE_FALLBACK) {
                  const list = bookmarks[dateStr] || [];

                  if (idx >= 0) { list[idx] = { ...list[idx], ...updated }; saveFallbackBookings(); }
                                    else { showToast('⚠️ 找不到該預約，可能已被刪除'); return; }
                                  } else {
                                                              if (!await fbUpdate(window._ref(window.db, `bookings/${dateStr}/${editingBookingId}`), updated)) return;
                                                            }

        closeModal();
        showToast(`✅ 已修改：教練${coachName(editingCoach)} ${editingDuration}分鐘`);
        if (window.USE_FALLBACK) { bookings = bookmarks; }
        switchView(currentView);
      }

      async function deleteBooking() {
                    if (!checkPassword('pwd-edit')) return;
                    const { dateStr } = editingSlot;

              // 團課：找出所有同 groupId 的預約一併刪除
              const allList = getBookingsForDate(dateStr);
              const target = allList.find(b => b.id === editingBookingId);
              const groupId = target?.groupId;

              if (window.USE_FALLBACK) {
                const list = bookmarks[dateStr] || [];
                if (groupId) {
                  bookmarks[dateStr] = list.filter(b => b.groupId !== groupId);
                } else {
                  bookmarks[dateStr] = list.filter(b => b.id !== editingBookingId);
                }
                saveFallbackBookings();
              } else {
                if (groupId) {
                  const targets = allList.filter(b => b.groupId === groupId);
                  for (const b of targets) {
                    if (!await fbRemove(window._ref(window.db, `bookings/${dateStr}/${b.id}`))) return;
                  }
                } else {
                  if (!await fbRemove(window._ref(window.db, `bookings/${dateStr}/${editingBookingId}`))) return;
                }
              }
              closeModal();
              showToast(groupId ? '🗑️ 已取消團課' : '🗑️ 已取消預約');
              if (window.USE_FALLBACK) { bookings = bookmarks; }
              switchView(currentView);
            }

      function navigateDate(delta) {

                currentDate.setDate(currentDate.getDate() + delta);
              } else {
                // 用 setDate(1) 先鎖在第一天，避免 setMonth 漂移
                currentDate.setDate(1);
                currentDate.setMonth(currentDate.getMonth() + delta);
              }
              switchView(currentView);
            }

      // ====== DATA BINDING ======
      async function initData() {
        if (window.USE_FALLBACK) {
          loadFallbackBookings();
          bookings = bookmarks;
          document.getElementById('loading').style.display = 'none';
          switchView('day');
          // 定時刷新本地資料（跨 tab 同步）
          window.addEventListener('storage', (e) => {
            if (e.key === 'relife_bookings') {
              loadFallbackBookings();
              bookings = bookmarks;
              switchView(currentView);
            }
          });
        } else {
          // Firebase: 監聽 bookings 節點
          window._onValue(window._ref(window.db, 'bookings'), (snapshot) => {
            bookings = snapshot.val() || {};
            document.getElementById('loading').style.display = 'none';
            switchView(currentView);
          }, (err) => {
            console.error('Firebase read error:', err);
            document.getElementById('loading').innerHTML =
              '<p style="color:var(--danger);font-size:0.9rem">⚠️ Firebase 連線失敗，請檢查設定金鑰</p>';
          });
        }
      }

      // ====== INIT ======
      // 因為 module script 有 await，DOMContentLoaded 可能已經觸發過了
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initData);
      } else {
        initData();
      }

      // ====== Expose for inline onclick ======
      window.switchView = switchView;
      window.navigateDate = navigateDate;
      window.goToday = goToday;
      window.openCreateModal = openCreateModal;
      window.openEditModal = openEditModal;
      window.selectDuration = selectDuration;
      window.selectDurationEdit = selectDurationEdit;
      window.createBooking = createBooking;
      window.updateBooking = updateBooking;
      window.deleteBooking = deleteBooking;
      window.closeModal = closeModal;
    </script>
  </body>
</html>
